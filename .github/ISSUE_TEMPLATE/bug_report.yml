name: Bug report / 报告问题
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect? / 发生了什么，你期望的是什么？
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx tinyfactory doctor` / doctor 自检输出
      description: It lists what each source found. Remove anything private (job names, paths) before posting.
      render: text
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: OS, browser, how you run it / 系统、浏览器、运行方式
      placeholder: macOS 15, Chrome 141, npx github:ybkjs/tinyfactory
    validations: { required: true }
  - type: textarea
    id: more
    attributes:
      label: Screenshot or console errors / 截图或浏览器控制台报错
